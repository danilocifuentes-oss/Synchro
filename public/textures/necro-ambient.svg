<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#050505" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g opacity="0.05" fill="#0b0b0b">
    <circle cx="120" cy="80" r="200"/>
    <circle cx="620" cy="420" r="260"/>
  </g>
  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)"/>
</svg>

