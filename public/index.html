<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYNCHRO</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>SYNCHRO</h1>
        <p>No eres el único que lo está pensando.</p>
      </header>

      <section class="panel">
        <p class="status-meta">
          <span id="localClock"></span>
          <span class="status-divider">·</span>
          <span id="activeUsersLine"></span>
        </p>
        <label for="thoughtInput">¿Qué estás pensando ahora?</label>
        <p id="topicLine" class="topic-line"></p>
        <textarea
          id="thoughtInput"
          maxlength="280"
          placeholder="Escribe una idea, emoción o pregunta..."
        ></textarea>
        <button id="syncButton">Sincronizar</button>
        <p id="status" class="status"></p>
      </section>

      <section id="resultPanel" class="panel hidden">
        <h2>Resultado</h2>
        <div class="sync-badge-row">
          <span id="syncLevelBadge" class="sync-level-badge"></span>
          <span id="connectionLine" class="connection-line"></span>
        </div>
        <div id="perfectMatchBanner" class="perfect-match-banner hidden">
          ⚡ MATCH PERFECTO
          <span id="perfectMatchMeta" class="perfect-match-meta"></span>
        </div>
        <p id="submittedThoughtLine" class="submitted-thought-line"></p>
        <p id="countLine" class="count-line"></p>
        <p id="emotionLine" class="emotion-line"></p>
        <div class="result-actions">
          <button type="button" id="shareResultBtn" class="btn-share" disabled>
            Compartir resultado
          </button>
          <span id="shareFeedback" class="share-feedback hidden" aria-live="polite"></span>
        </div>
        <div id="profilePanel" class="profile-panel hidden">
          <div class="profile-panel-head">
            <span class="profile-panel-badge">Insight</span>
            <h3>Tu perfil SYNCHRO</h3>
          </div>
          <div id="profileText" class="profile-insight-stack"></div>
          <p id="profileConfidenceLine" class="profile-confidence-line"></p>
        </div>

        <h3>Pensamientos similares</h3>
        <p id="similarCountLine" class="similar-count-line"></p>
        <ul id="similarList" class="thought-list"></ul>
      </section>

      <details class="panel">
        <summary>Tu resonancia</summary>
        <p id="resonanceLine" class="resonance-line"></p>
        <div class="resonance-meter">
          <div id="resonanceFill" class="resonance-fill"></div>
        </div>
        <p id="stateLine" class="state-line"></p>
        <p id="rankingLine" class="ranking-line"></p>
      </details>

      <details class="panel">
        <summary>Perfil mental</summary>
        <p id="profileLine" class="profile-line"></p>
        <p id="insightLine" class="insight-line"></p>
        <p id="predictionLine" class="prediction-line"></p>
      </details>

      <details class="panel panel-world" id="worldNowSection">
        <summary>Mundo ahora</summary>
        <p class="world-live-hint" id="worldLiveHint">Señal colectiva en vivo</p>
        <ul id="worldNowList" class="world-now-list"></ul>
        <p id="worldEventLine" class="world-event-line"></p>
      </details>

      <details class="panel">
        <summary>Pensamientos recientes</summary>
        <ul id="feedList" class="thought-list"></ul>
      </details>

      <details class="panel">
        <summary>Tópico compartido (mock)</summary>
        <div class="topic-share">
          <label for="newTopicInput">Crear tópico</label>
          <input id="newTopicInput" type="text" maxlength="120" placeholder="Ej: ‘renunciar’ / ‘miedo’ / ‘amor’" />
          <button id="createTopicBtn" type="button">Generar código</button>
          <p id="topicShareResult" class="topic-share-result"></p>
          <button id="copyTopicCodeBtn" type="button" class="btn-share hidden">Copiar código</button>
        </div>
      </details>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
